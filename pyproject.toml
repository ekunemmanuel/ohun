[project]
name = "ohun"
version = "0.1.0"
description = "Speech to text and text to speech for Nigerian languages, starting with Yoruba and Nigerian Pidgin"
readme = "README.md"
authors = [
    { name = "ekunemmanuel", email = "emmanuelapabiekun@gmail.com" }
]
requires-python = ">=3.12,<3.13"  # PyTorch 2.2.2 (the last Intel Mac build) stops at 3.12
dependencies = [
    "jiwer>=4.0.0",
]

[project.scripts]
ohun = "ohun.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
eval = [
    "accelerate>=0.26",
    "huggingface-hub<1",
    "numpy<2",
    "pyarrow<22",
    "scipy>=1.17.1",
    "soundfile>=0.14.0",
    "torch==2.2.2",
    "transformers>=4.45,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
